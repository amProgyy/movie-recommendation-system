
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Recommendation</title>

    <link rel="stylesheet" href="../static/css/recommendation.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🎬 MovieRec
        </div>

        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/recommendation">Recommendations</a>
            <a href="/logout">Logout</a>
        </div>

    </nav>


    <!-- Main Container -->
    <main class="container">

        <!-- Heading -->
        <section class="hero">

            <h1>Find Your Next Movie</h1>

            <p>
                Enter a movie you like and discover similar movies.
            </p>

        </section>


        <!-- Search Section -->
        <section class="search-section">

            <form id="recommendation-form">

                <div class="search-box">

                    <input
                        type="text"
                        id="movie-input"
                        name="movie"
                        placeholder="Enter movie name..."
                        autocomplete="off"
                        required
                    >

                    <button type="submit">
                        Recommend
                    </button>

                </div>

            </form>

            <!-- Loading Message -->
            <p id="loading" class="message" style="display: none;">
                Finding movies for you...
            </p>

            <!-- Error Message -->
            <p id="error-message" class="error-message" style="display: none;"></p>

        </section>


        <!-- Recommendation Section -->
        <section class="recommendation-section">

            <h2>Recommended Movies</h2>

            <div id="recommendation-container" class="movie-grid">

                <!-- Movie cards will be inserted here using JavaScript -->

                <div class="empty-message">
                    <p>
                        Search for a movie to get recommendations.
                    </p>
                </div>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="../static/js/recommendation.js"></script>

</body>

</html>
